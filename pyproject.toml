[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-crypto-forensics"
version = "0.2.0"
description = "Passive SMTP/IMAP/POP3 cryptographic security posture assessment"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "pyshark>=0.6",
  "cryptography>=42.0",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "jinja2>=3.1",
]

[project.scripts]
ecforensics = "ecforensics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
