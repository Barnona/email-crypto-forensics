name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install TShark
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - name: Install package
        run: pip install -e . -r requirements.txt
      - name: Run tests
        run: pytest -q
